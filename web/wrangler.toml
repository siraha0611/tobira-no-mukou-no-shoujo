name = "tobira-no-mukou-no-shoujo-web"
main = "src/worker.ts"
compatibility_date = "2026-06-18"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "DOOR_KV"
id = "c0fc91cb155b4248ac5abcdb822bfabf"
preview_id = "c0fc91cb155b4248ac5abcdb822bfabf"

# Research D1: 有効化済み(2026-06-20)。研究モード(?pid=)時のみ書き込む。通常プレイは無影響。
# ⚠️ database_id は実在DBの値。これを空/placeholderに戻すと deploy が壊れるので注意。
[[d1_databases]]
binding = "RESEARCH_DB"
database_name = "tobira_research"
database_id = "37d8544a-d407-47db-9dfc-2be4b5f798d2"
migrations_dir = "migrations"

[vars]
# コスト上限: KASO「月$5まで」(2026-06-18)が通常運用の既定値だが、
# nコ展(7/24-26)会期中は50/日だと即枯渇し内蔵台本エンジンに落ちてしまう(2026-07-24発覚・実際に発生)ため600へ引き上げ。
# 最悪見積(¥0.5/call)でも 600×3日×¥0.5≒¥900。展示終了後は必ず"50"へ戻すこと。
# ※Anthropic Console側の月次spend上限(要KASOログイン)は未確認のため、上限額を体で保証しているのはこの値のみ。
DAILY_CALL_CAP = "600"
AIVIS_TTS_ENABLED = "true"
AIVIS_MODEL_UUID = "22e8ed77-94fe-4ef2-871f-a86f94e9a579"  # コハク(オズチャット/CV ねゆたろ)
AIVIS_STYLE_ID = "2"  # コハクのスタイル 0=ノーマル/1=あまあま/2=せつなめ/3=ねむたい
AIVIS_VOLUME = "2.0"  # クラウド声の音量(0.0〜2.0)。上限まで引き上げ(2026-07-22 音が小さい報告対応)
# nコ展(7/24-26)向けに引き上げ(2026-07-19 KASO承認「お金かけてもいい」)。
# ¥440/万字 → 40,000字/日 = 最大¥1,760/日・声つき約40セッション/日。展示後に15000へ戻してよい
AIVIS_DAILY_CHAR_CAP = "40000"
# 事後アンケート回答の通知メール(Resend)。RESEND_API_KEY は secret(`wrangler secret put RESEND_API_KEY`)。
# 未設定なら通知はスキップ(回答のD1保存はそのまま動く)。差出人は既定 onboarding@resend.dev
# (独自ドメイン不要・Resend登録アドレス=この NOTIFY_EMAIL 宛にのみ送れる)。
NOTIFY_EMAIL = "anb14625siraha@gmail.com"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# v1はTurnstileを無効で公開(日次上限+セッショントークン+ターン上限で保護)。
# 本物のTurnstile設定後に "true" にし、public/index.htmlのdata-sitekeyを実キーへ。
TURNSTILE_ENABLED = "false"
# 展示(nコ展 7/24-26)の会話記録用に有効化(2026-07-24・KASO承認)。
# 展示の各セッションはフロントが自動でparticipantId(EXH-...)を発行してD1(sessions.transcript)に記録される。
# 通常Web版は?pidが無ければ何も記録されない(挙動は従来通り)。
RESEARCH_TRANSCRIPT = "true"
